name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Signs + notarizes when these secrets exist; otherwise the app is ad-hoc signed.
      - name: Build DMG + ZIP (Apple Silicon + Intel)
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          EXTRA=""
          # Missing secrets arrive as empty strings; electron-builder would treat CSC_LINK="" as a path.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          if [ -z "${CSC_LINK:-}" ]; then EXTRA="-c.mac.identity=-"; fi
          npm run build
          set -o pipefail
          if ! npx electron-builder --mac --publish never $EXTRA 2>&1 | tee builder.log; then
            # Surface the failure as an annotation (readable via the checks API).
            echo "::error title=electron-builder failed::$(tail -40 builder.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: GrokBot-Local-mac
          path: |
            dist/*.dmg
            dist/*.zip

      # Tag pushes (v*) create a Release; main pushes update the rolling "latest-build" pre-release.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('GrokBot Local {0}', github.ref_name) || 'GrokBot Local – latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            **Download:** `GrokBot Local-<version>-arm64.dmg` for Apple Silicon (M1–M4), `GrokBot Local-<version>.dmg` for Intel.

            First launch (app is ad-hoc signed, not notarized):
            ```
            xattr -dr com.apple.quarantine "/Applications/GrokBot Local.app"
            ```
            Built from ${{ github.sha }}.
