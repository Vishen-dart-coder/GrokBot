name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      # Signs + notarizes automatically when these secrets are set; otherwise builds an ad-hoc signed app.
      - name: Build DMG + ZIP (arm64 & x64)
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          if [ -z "$CSC_LINK" ]; then EXTRA="-c.mac.identity=-"; fi
          npm run build
          npx electron-builder --mac --publish never $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: GrokBot-Local-mac
          path: |
            dist/*.dmg
            dist/*.zip
